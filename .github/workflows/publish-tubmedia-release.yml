name: Publish Tubmedia Release

on:
  push:
    branches:
      - main
    paths:
      - package.json
      - package-lock.json
      - src/shared/constants/app.ts
      - CHANGELOG.md
      - .github/workflows/publish-tubmedia-release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tubmedia-release
  cancel-in-progress: false

jobs:
  build-and-publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.head_commit.message, 'release: Tubmedia ')
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_VERSION: 1.3.7

    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'
          cache: npm

      - name: Verify release identity is new
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $Package = Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json
          $Version = [string]$Package.version
          if ($Version -ne $env:EXPECTED_VERSION) {
            throw "Expected version $env:EXPECTED_VERSION but package.json contains $Version."
          }
          $Constants = Get-Content -LiteralPath src/shared/constants/app.ts -Raw
          if (-not $Constants.Contains("APP_VERSION_LABEL = 'v$Version'")) {
            throw 'Renderer version label does not match package.json.'
          }
          $Tag = "v$Version"
          & gh release view $Tag --repo $env:GITHUB_REPOSITORY *> $null
          $ReleaseExitCode = $LASTEXITCODE
          if ($ReleaseExitCode -eq 0) {
            throw "Release $Tag already exists; refusing to overwrite it."
          }
          if ($ReleaseExitCode -ne 1) {
            throw "Checking whether release $Tag exists failed with exit code $ReleaseExitCode."
          }
          & git ls-remote --exit-code --tags origin "refs/tags/$Tag" *> $null
          $TagExitCode = $LASTEXITCODE
          if ($TagExitCode -eq 0) {
            throw "Tag $Tag already exists without a release; manual inspection is required."
          }
          if ($TagExitCode -ne 2) {
            throw "Checking whether tag $Tag exists failed with exit code $TagExitCode."
          }
          "VERSION=$Version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TAG=$Tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          exit 0

      - name: Ensure NSIS compiler is available
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Candidates = @(
            "${env:ProgramFiles(x86)}\NSIS\makensis.exe",
            "$env:ProgramFiles\NSIS\makensis.exe"
          )
          if (-not ($Candidates | Where-Object { Test-Path -LiteralPath $_ })) {
            & choco install nsis --no-progress -y
            if ($LASTEXITCODE -ne 0) {
              throw 'Installing NSIS on the clean Windows runner failed.'
            }
          }

      - name: Build and verify official Windows release
        shell: pwsh
        run: npm.cmd run dist:official

      - name: Validate release assets and prepare notes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $InstallerName = "Download-video-Tubmedia-Setup-$env:VERSION-x64.exe"
          $BlockmapName = "$InstallerName.blockmap"
          $ChecksumName = "Download-video-Tubmedia-$env:VERSION-SHA256.txt"
          $Expected = @($InstallerName, $BlockmapName, $ChecksumName, 'latest.yml')
          foreach ($Name in $Expected) {
            $Path = Join-Path release $Name
            if (-not (Test-Path -LiteralPath $Path -PathType Leaf)) {
              throw "Missing release asset: $Path"
            }
          }
          $Latest = Get-Content -LiteralPath release/latest.yml -Raw
          if (-not $Latest.StartsWith("version: $env:VERSION`n")) {
            throw 'latest.yml version or UTF-8 line ending is invalid.'
          }
          if (-not $Latest.Contains("url: `"$InstallerName`"")) {
            throw 'latest.yml installer URL does not match the canonical asset name.'
          }
          $ChecksumPath = Join-Path release $ChecksumName
          $ChecksumLine = (Get-Content -LiteralPath $ChecksumPath | Select-Object -First 1).Trim()
          $ExpectedSha256 = ($ChecksumLine -split '\s+')[0].ToUpperInvariant()
          $ActualSha256 = (Get-FileHash -LiteralPath (Join-Path release $InstallerName) -Algorithm SHA256).Hash
          if ($ExpectedSha256 -ne $ActualSha256) {
            throw 'Installer SHA-256 does not match its checksum file.'
          }
          @"
          ## Tubmedia $env:VERSION

          - Sửa lỗi ghép video bị chặn sai khi FFprobe báo 30,000 FPS và 29,996 FPS.
          - Đồng bộ ngưỡng tương thích concat với ngưỡng normalize hiện có là 0,01 FPS.
          - Vẫn kiểm tra nghiêm ngặt nominal FPS, time base, codec, profile, extradata và audio layout.
          - Bổ sung kiểm thử hồi quy cho sai số FPS vô hại và khác biệt chuẩn FPS thực sự.

          ### Xác minh bản phát hành

          - Quy trình build chính thức, typecheck, lint, unit, integration và Windows E2E: PASS
          - Target commit: $env:GITHUB_SHA
          - SHA-256: $ActualSha256

          ### Chữ ký Windows

          Bộ cài chưa có chữ ký Authenticode. Windows có thể hiển thị Unknown publisher hoặc SmartScreen.
          Hãy xác minh SHA-256 trước khi chạy.
          "@ | Set-Content -LiteralPath release-notes.md -Encoding utf8NoBOM

      - name: Create verified draft release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Installer = "release/Download-video-Tubmedia-Setup-$env:VERSION-x64.exe"
          $Blockmap = "$Installer.blockmap"
          $Checksum = "release/Download-video-Tubmedia-$env:VERSION-SHA256.txt"
          & gh release create $env:TAG `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "Tubmedia $env:VERSION" `
            --notes-file release-notes.md `
            --draft `
            $Installer $Blockmap $Checksum release/latest.yml
          if ($LASTEXITCODE -ne 0) {
            throw 'Creating the draft GitHub Release failed.'
          }

      - name: Download and verify draft assets byte-for-byte
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $InstallerName = "Download-video-Tubmedia-Setup-$env:VERSION-x64.exe"
          $Names = @(
            $InstallerName,
            "$InstallerName.blockmap",
            "Download-video-Tubmedia-$env:VERSION-SHA256.txt",
            'latest.yml'
          )
          $ReleaseJson = & gh release view $env:TAG --repo $env:GITHUB_REPOSITORY `
            --json tagName,isDraft,isPrerelease,targetCommitish,assets
          $Release = $ReleaseJson | ConvertFrom-Json
          if ($Release.tagName -ne $env:TAG -or -not $Release.isDraft -or $Release.isPrerelease) {
            throw 'Draft release state is invalid.'
          }
          $UploadedNames = @($Release.assets | ForEach-Object { $_.name })
          foreach ($Name in $Names) {
            if ($Name -notin $UploadedNames) {
              throw "Draft release is missing asset: $Name"
            }
          }
          $VerifyDir = Join-Path $env:RUNNER_TEMP "tubmedia-$env:VERSION-release-verify"
          New-Item -ItemType Directory -Path $VerifyDir -Force | Out-Null
          & gh release download $env:TAG --repo $env:GITHUB_REPOSITORY --dir $VerifyDir
          if ($LASTEXITCODE -ne 0) {
            throw 'Downloading draft release assets for verification failed.'
          }
          foreach ($Name in $Names) {
            $LocalHash = (Get-FileHash -LiteralPath (Join-Path release $Name) -Algorithm SHA256).Hash
            $RemoteHash = (Get-FileHash -LiteralPath (Join-Path $VerifyDir $Name) -Algorithm SHA256).Hash
            if ($LocalHash -ne $RemoteHash) {
              throw "Uploaded asset differs from local verified file: $Name"
            }
          }

      - name: Publish release as Latest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & gh release edit $env:TAG --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) {
            throw 'Publishing the verified release failed; inspect the draft before retrying.'
          }
          $Latest = & gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" | ConvertFrom-Json
          if ($Latest.tag_name -ne $env:TAG -or $Latest.draft -or $Latest.prerelease) {
            throw 'The published release is not the public Latest release.'
          }
          $ExpectedNames = @(
            "Download-video-Tubmedia-Setup-$env:VERSION-x64.exe",
            "Download-video-Tubmedia-Setup-$env:VERSION-x64.exe.blockmap",
            "Download-video-Tubmedia-$env:VERSION-SHA256.txt",
            'latest.yml'
          )
          $LatestNames = @($Latest.assets | ForEach-Object { $_.name })
          foreach ($Name in $ExpectedNames) {
            if ($Name -notin $LatestNames) {
              throw "Public Latest release is missing asset: $Name"
            }
          }
